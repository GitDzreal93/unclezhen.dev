<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>课程 · 臻叔</title>
  <link rel="stylesheet" href="site.css" />
  <style>
    .course-card {
      display: grid;
      gap: 0;
      height: 100%;
    }
    .course-card .top {
      padding: 20px 20px 0;
      display: grid;
      gap: 12px;
    }
    .course-card .body {
      padding: 12px 20px 20px;
      display: grid;
      gap: 14px;
      flex: 1;
    }
    .course-card p {
      color: var(--muted);
      font-size: 14px;
    }
    .outline {
      list-style: none;
      display: grid;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
    }
    .outline li {
      display: flex;
      gap: 8px;
      align-items: baseline;
    }
    .outline li::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 1px;
      background: color-mix(in oklch, var(--accent) 70%, white);
      flex-shrink: 0;
      transform: translateY(-1px);
    }
    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .level {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>
  <nav class="site-nav" data-od-id="site-nav" aria-label="主导航">
    <div class="site-nav__inner">
      <a class="brand" href="home.html"><span class="brand__mark">臻</span><span>臻叔</span></a>
      <ul class="nav-links">
        <li><a href="home.html">首页</a></li>
        <li><a href="blog.html">博客</a></li>
        <li><a href="projects.html">项目</a></li>
        <li><a href="courses.html" aria-current="page">课程</a></li>
        <li><a href="shop.html">商店</a></li>
      </ul>
      <a class="nav-cta" href="#catalog">选课</a>
      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-label="打开菜单">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </nav>
  <div class="nav-drawer" data-nav-drawer>
    <ul>
      <li><a href="home.html">首页</a></li>
      <li><a href="blog.html">博客</a></li>
      <li><a href="projects.html">项目</a></li>
      <li><a href="courses.html">课程</a></li>
      <li><a href="shop.html">商店</a></li>
    </ul>
    <a class="drawer-cta" href="#catalog">选课</a>
  </div>

  <main id="main">
    <header class="page-hero wrap" data-od-id="courses-hero">
      <div class="eyebrow">Courses</div>
      <h1 data-od-id="courses-title">课程</h1>
      <p class="lead">面向开发者与想转产品交付的工程师。先看大纲与适合谁，再决定是否报名。</p>
      <div class="toolbar">
        <div class="filters" id="course-filters" data-od-id="course-filters"></div>
      </div>
    </header>

    <div class="wrap" id="catalog" style="padding-bottom:72px">
      <div class="grid-3" id="course-grid" data-od-id="course-grid"></div>
    </div>
  </main>

  <footer class="site-footer" data-od-id="footer">
    <div class="site-footer__inner">
      <div class="site-footer__row">
        <div>
          <a class="brand" href="home.html"><span class="brand__mark">臻</span><span>臻叔</span></a>
          <p style="margin-top:12px">创意工程师 · 博客 / 项目 / 课程 / 商店</p>
        </div>
        <ul class="footer-links">
          <li><a href="blog.html">博客</a></li>
          <li><a href="projects.html">项目</a></li>
          <li><a href="courses.html">课程</a></li>
          <li><a href="shop.html">商店</a></li>
        </ul>
      </div>
      <p class="footer-copy">© 臻叔 · Prototype</p>
    </div>
  </footer>

  <div class="modal-backdrop" id="enroll-modal" aria-hidden="true" role="dialog" aria-labelledby="enroll-title">
    <div class="modal">
      <h3 id="enroll-title">报名意向</h3>
      <p id="enroll-desc">提交后仅作原型演示，不会扣款。</p>
      <form id="enroll-form">
        <input type="hidden" id="enroll-course" name="course" />
        <div class="field">
          <label for="e-name">称呼</label>
          <input id="e-name" name="name" required placeholder="怎么叫你" />
        </div>
        <div class="field">
          <label for="e-contact">邮箱 / 微信</label>
          <input id="e-contact" name="contact" required placeholder="方便联系的方式" />
        </div>
        <div class="field">
          <label for="e-note">你的基础（可选）</label>
          <textarea id="e-note" name="note" placeholder="例如：写过 React，没碰过 WebGL"></textarea>
        </div>
        <div class="modal__actions">
          <button class="btn btn--ghost btn--sm" type="button" data-close-modal="enroll-modal">取消</button>
          <button class="btn btn--primary btn--sm" type="submit">提交意向</button>
        </div>
      </form>
    </div>
  </div>

  <script src="site-nav.js"></script>
  <script>
    var COURSES = [
      {
        id: "webgl-start",
        title: "Three.js 个人站动效实战",
        level: "中级",
        hours: "6 课时",
        price: 299,
        audience: "有前端基础，想给作品加舞台感",
        outcome: "独立完成 IP/产品 3D 展示区并做好降级",
        outline: ["场景与光照", "贴图与透明", "指针交互", "性能与 fallback"],
        tag: "动效"
      },
      {
        id: "fe-craft",
        title: "前端手感：从组件到整站",
        level: "进阶",
        hours: "8 课时",
        price: 399,
        audience: "能写业务页，想提升质感与一致性",
        outcome: "搭一套令牌 + 导航 + 列表/详情交互范式",
        outline: ["设计令牌", "排版与间距", "状态与反馈", "响应式重构"],
        tag: "工程"
      },
      {
        id: "ship-course",
        title: "独立开发者上架指南",
        level: "入门",
        hours: "4 课时",
        price: 199,
        audience: "有 side project，想卖课或卖软件",
        outcome: "跑通定价、落地页结构与最小购买闭环",
        outline: ["定位与受众", "课程大纲写法", "商店最小集", "内容运营节奏"],
        tag: "商业"
      },
      {
        id: "react-motion",
        title: "React 动效克制课",
        level: "中级",
        hours: "5 课时",
        price: 249,
        audience: "React 开发者，讨厌花哨又想要记忆点",
        outcome: "会在关键路径放「一处」决定性动效",
        outline: ["何时该动", "布局动画", "可访问性", "案例拆解"],
        tag: "动效"
      }
    ];

    var active = "全部";

    function tags() {
      var s = { "全部": 1 };
      COURSES.forEach(function (c) { s[c.tag] = 1; });
      return Object.keys(s);
    }

    function renderFilters() {
      var el = document.getElementById("course-filters");
      el.innerHTML = tags().map(function (t) {
        return '<button type="button" class="filter-btn' + (t === active ? " is-active" : "") + '" data-tag="' + t + '">' + t + "</button>";
      }).join("");
      el.querySelectorAll("[data-tag]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          active = btn.getAttribute("data-tag");
          renderFilters();
          render();
        });
      });
    }

    function render() {
      var list = COURSES.filter(function (c) { return active === "全部" || c.tag === active; });
      var grid = document.getElementById("course-grid");
      grid.innerHTML = list.map(function (c) {
        return (
          '<article class="card course-card" data-od-id="course-' + c.id + '">' +
          '<div class="top">' +
          '<div class="row-between"><span class="tag tag--accent">' + c.tag + '</span><span class="level">' + c.level + " · " + c.hours + "</span></div>" +
          "<h3>" + c.title + "</h3>" +
          "<p>" + c.audience + "</p>" +
          "</div><div class='body'>" +
          "<p><strong style='color:var(--fg);font-weight:550'>学完能交付：</strong>" + c.outcome + "</p>" +
          '<ul class="outline">' + c.outline.map(function (o) { return "<li>" + o + "</li>"; }).join("") + "</ul>" +
          '<div class="row-between">' +
          '<div class="price">¥' + c.price + " <small>起</small></div>" +
          '<button type="button" class="btn btn--primary btn--sm" data-enroll="' + c.id + '">报名意向</button>' +
          "</div></div></article>"
        );
      }).join("");
      grid.querySelectorAll("[data-enroll]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.getAttribute("data-enroll");
          var c = COURSES.find(function (x) { return x.id === id; });
          document.getElementById("enroll-course").value = c.title;
          document.getElementById("enroll-desc").textContent =
            "课程：「" + c.title + "」· 标价 ¥" + c.price + "（演示，不扣款）";
          ZhenShu.openModal("enroll-modal");
        });
      });
    }

    document.getElementById("enroll-form").addEventListener("submit", function (e) {
      e.preventDefault();
      ZhenShu.closeModal("enroll-modal");
      ZhenShu.toast("意向已记录（原型）");
      e.target.reset();
    });

    renderFilters();
    render();
  </script>
</body>
</html>
