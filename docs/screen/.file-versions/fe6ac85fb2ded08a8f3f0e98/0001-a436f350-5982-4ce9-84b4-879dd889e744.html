<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>项目展示 · 臻叔</title>
  <link rel="stylesheet" href="site.css" />
  <style>
    .proj-card .thumb {
      aspect-ratio: 16/10;
      background:
        radial-gradient(ellipse 80% 70% at 70% 30%, color-mix(in oklch, var(--accent) 22%, transparent), transparent 60%),
        linear-gradient(160deg, oklch(22% 0.03 250), oklch(16% 0.02 250));
      border-bottom: 1px solid rgba(255,255,255,.06);
      position: relative;
      overflow: hidden;
    }
    .proj-card .thumb::after {
      content: attr(data-label);
      position: absolute;
      left: 14px;
      bottom: 14px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 6px 10px;
      border-radius: 8px;
      background: color-mix(in oklch, var(--bg) 78%, transparent);
      border: 1px solid rgba(255,255,255,.1);
      backdrop-filter: blur(8px);
      color: var(--muted);
      box-shadow: 0 8px 20px rgba(0,0,0,.25);
    }
    .proj-card .thumb-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: .7;
    }
    .proj-card .thumb-shape {
      position: absolute;
      width: 42%;
      height: 48%;
      right: 12%;
      top: 22%;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.04);
      transform: rotate(-6deg);
      box-shadow: 0 16px 40px rgba(0,0,0,.3);
    }
    .stack { display: flex; flex-wrap: wrap; gap: 6px; }
    .detail-panel {
      display: none;
      margin-top: 28px;
      padding: 24px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.1);
      background: var(--surface);
    }
    .detail-panel.is-open { display: block; }
    .detail-panel h2 { margin: 8px 0 12px; }
    .detail-grid {
      display: grid;
      gap: 20px;
    }
    @media (min-width: 800px) {
      .detail-grid { grid-template-columns: 1.4fr 1fr; }
    }
    .detail-panel p { color: var(--muted); font-size: 15px; }
    .kv { display: grid; gap: 10px; }
    .kv div {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 8px;
      font-size: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .kv dt { color: var(--muted); font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em; }
    .kv dd { color: var(--fg); }
  </style>
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>
  <nav class="site-nav" data-od-id="site-nav" aria-label="主导航">
    <div class="site-nav__inner">
      <a class="brand" href="home.html"><span class="brand__mark">臻</span><span>臻叔</span></a>
      <ul class="nav-links">
        <li><a href="home.html">首页</a></li>
        <li><a href="blog.html">博客</a></li>
        <li><a href="projects.html" aria-current="page">项目</a></li>
        <li><a href="courses.html">课程</a></li>
        <li><a href="shop.html">商店</a></li>
      </ul>
      <a class="nav-cta" href="courses.html">看看课程</a>
      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-label="打开菜单">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </nav>
  <div class="nav-drawer" data-nav-drawer>
    <ul>
      <li><a href="home.html">首页</a></li>
      <li><a href="blog.html">博客</a></li>
      <li><a href="projects.html">项目</a></li>
      <li><a href="courses.html">课程</a></li>
      <li><a href="shop.html">商店</a></li>
    </ul>
    <a class="drawer-cta" href="courses.html">看看课程</a>
  </div>

  <main id="main">
    <header class="page-hero wrap" data-od-id="projects-hero">
      <div class="eyebrow">Projects</div>
      <h1 data-od-id="projects-title">项目展示</h1>
      <p class="lead">交付案例与实验场。点卡片查看问题、方案与技术栈。</p>
      <div class="toolbar">
        <div class="filters" id="proj-filters" data-od-id="proj-filters"></div>
      </div>
    </header>

    <div class="wrap" style="padding-bottom:72px">
      <div class="grid-3" id="proj-grid" data-od-id="proj-grid"></div>
      <div class="detail-panel" id="detail" data-od-id="proj-detail" aria-live="polite">
        <button class="btn btn--ghost btn--sm" type="button" id="close-detail">收起详情</button>
        <div class="detail-grid">
          <div>
            <div class="card__meta" id="d-meta"></div>
            <h2 id="d-title"></h2>
            <p id="d-desc"></p>
            <p id="d-result" style="margin-top:12px"></p>
          </div>
          <dl class="kv" id="d-kv"></dl>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer" data-od-id="footer">
    <div class="site-footer__inner">
      <div class="site-footer__row">
        <div>
          <a class="brand" href="home.html"><span class="brand__mark">臻</span><span>臻叔</span></a>
          <p style="margin-top:12px">创意工程师 · 博客 / 项目 / 课程 / 商店</p>
        </div>
        <ul class="footer-links">
          <li><a href="blog.html">博客</a></li>
          <li><a href="projects.html">项目</a></li>
          <li><a href="courses.html">课程</a></li>
          <li><a href="shop.html">商店</a></li>
        </ul>
      </div>
      <p class="footer-copy">© 臻叔 · Prototype</p>
    </div>
  </footer>

  <script src="site-nav.js"></script>
  <script>
    var PROJECTS = [
      {
        id: "ip-site",
        name: "臻叔个人站",
        type: "产品",
        year: "2026",
        blurb: "带 3D IP 英雄区的多职能个人站：博客、项目、课程与商店。",
        problem: "个人品牌站点往往只有简历列表，缺少记忆点与商业闭环。",
        solution: "以手绘 IP 做 Three.js 舞台，深色网格工坊气质，四条业务入口可独立演进。",
        result: "原型已覆盖响应式导航、内容筛选与购买流程示意。",
        stack: ["Three.js", "HTML/CSS", "原生 JS"],
        role: "设计 + 前端"
      },
      {
        id: "ops-dash",
        name: "内容运营台",
        type: "工具",
        year: "2025",
        blurb: "课程与文章发布节奏看板，支持筛选与状态流转。",
        problem: "多渠道内容排期散落在表格，状态不同步。",
        solution: "统一看板 + 标签过滤 + 状态 pill，给运营一目了然的本周焦点。",
        result: "示意项目 · 指标待替换为真实数据。",
        stack: ["React", "TypeScript"],
        role: "前端负责人"
      },
      {
        id: "motion-kit",
        name: "动效组件包",
        type: "开源",
        year: "2025",
        blurb: "可复用的文字与背景动效，强调可访问与降级。",
        problem: "炫技组件难落地，性能与 reduced-motion 常被忽略。",
        solution: "每个组件带 fallback 与文档示例，默认尊重系统动效偏好。",
        result: "示意项目 · 星标数待填。",
        stack: ["React", "CSS", "Framer Motion"],
        role: "作者"
      },
      {
        id: "b2b-proto",
        name: "B2B 采购原型",
        type: "交付",
        year: "2024",
        blurb: "从询价到下单的多角色流程，桌面优先可点原型。",
        problem: "业务评审需要可点的全流程，而不是静态图。",
        solution: "分角色入口、表单校验、状态回执，减少评审会上的想象成本。",
        result: "示意项目 · 客户名可匿名。",
        stack: ["原型", "设计系统"],
        role: "交互 + 前端"
      },
      {
        id: "live-room",
        name: "直播课控台",
        type: "产品",
        year: "2024",
        blurb: "讲师侧控台：章节、问答、资料投放一体。",
        problem: "上课时窗口太多，讲师注意力被工具打断。",
        solution: "单屏分区：大纲、实时提问、资料库，快捷键提示。",
        result: "示意项目 · 完课率等指标待填。",
        stack: ["WebRTC", "React"],
        role: "产品顾问 + 前端"
      },
      {
        id: "shop-tpl",
        name: "数字商品模板",
        type: "模板",
        year: "2023",
        blurb: "面向独立开发者的轻量商店模板，可二开。",
        problem: "卖源码/模板时搭建商店成本高。",
        solution: "商品卡、购物车、结算成功页一套打通，主题 token 可换。",
        result: "本站商店页即衍生形态。",
        stack: ["HTML", "JS"],
        role: "作者"
      }
    ];

    var active = "全部";

    function types() {
      var s = { "全部": 1 };
      PROJECTS.forEach(function (p) { s[p.type] = 1; });
      return Object.keys(s);
    }

    function renderFilters() {
      var el = document.getElementById("proj-filters");
      el.innerHTML = types().map(function (t) {
        return '<button type="button" class="filter-btn' + (t === active ? " is-active" : "") + '" data-type="' + t + '">' + t + "</button>";
      }).join("");
      el.querySelectorAll("[data-type]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          active = btn.getAttribute("data-type");
          renderFilters();
          renderGrid();
        });
      });
    }

    function renderGrid() {
      var list = PROJECTS.filter(function (p) { return active === "全部" || p.type === active; });
      var grid = document.getElementById("proj-grid");
      grid.innerHTML = list.map(function (p) {
        return (
          '<article class="card proj-card" data-od-id="project-' + p.id + '">' +
          '<div class="thumb" data-label="' + p.type + '"><div class="thumb-grid"></div><div class="thumb-shape"></div></div>' +
          '<div class="card__body">' +
          '<div class="card__meta"><span class="mono">' + p.year + '</span><span class="tag">' + p.type + "</span></div>" +
          "<h3>" + p.name + "</h3>" +
          "<p class='muted' style='font-size:14px'>" + p.blurb + "</p>" +
          '<div class="stack">' + p.stack.map(function (s) { return '<span class="tag">' + s + "</span>"; }).join("") + "</div>" +
          '<button type="button" class="btn btn--ghost btn--sm" data-open="' + p.id + '" style="justify-self:start;margin-top:4px">查看详情</button>' +
          "</div></article>"
        );
      }).join("");
      grid.querySelectorAll("[data-open]").forEach(function (btn) {
        btn.addEventListener("click", function () { openDetail(btn.getAttribute("data-open")); });
      });
    }

    function openDetail(id) {
      var p = PROJECTS.find(function (x) { return x.id === id; });
      if (!p) return;
      var panel = document.getElementById("detail");
      panel.classList.add("is-open");
      document.getElementById("d-title").textContent = p.name;
      document.getElementById("d-meta").innerHTML =
        '<span class="mono">' + p.year + '</span><span class="tag">' + p.type + "</span>";
      document.getElementById("d-desc").textContent = "问题：" + p.problem + " 方案：" + p.solution;
      document.getElementById("d-result").textContent = "结果：" + p.result;
      document.getElementById("d-kv").innerHTML =
        "<div><dt>角色</dt><dd>" + p.role + "</dd></div>" +
        "<div><dt>技术栈</dt><dd>" + p.stack.join(" · ") + "</dd></div>" +
        "<div><dt>类型</dt><dd>" + p.type + "</dd></div>";
    }

    document.getElementById("close-detail").addEventListener("click", function () {
      document.getElementById("detail").classList.remove("is-open");
    });

    renderFilters();
    renderGrid();
  </script>
</body>
</html>
