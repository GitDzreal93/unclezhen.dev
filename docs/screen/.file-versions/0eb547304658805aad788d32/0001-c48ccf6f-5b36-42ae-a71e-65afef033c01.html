<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>臻叔个人站 · 原型导航</title>
  <meta http-equiv="refresh" content="0; url=home.html" />
  <link rel="stylesheet" href="site.css" />
  <style>
    .launch {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
      position: relative;
      z-index: 1;
    }
    .launch-card {
      width: min(100%, 520px);
      padding: 32px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.1);
      background: var(--surface);
      display: grid;
      gap: 20px;
    }
    .launch-card h1 { font-size: 28px; }
    .launch-card p { color: var(--muted); font-size: 15px; }
    .launch-links { display: grid; gap: 8px; }
    .launch-links a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.03);
      font-weight: 550;
      font-size: 14px;
      letter-spacing: .02em;
    }
    .launch-links a:hover {
      border-color: rgba(255,255,255,.16);
      background: rgba(255,255,255,.05);
    }
    .launch-links span {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
      font-weight: 400;
    }
  </style>
  <script>location.replace("home.html");</script>
</head>
<body>
  <div class="launch">
    <div class="launch-card" data-od-id="launcher">
      <div class="eyebrow">Zhen Shu</div>
      <h1>臻叔个人站原型</h1>
      <p>若未自动跳转，请选择页面：</p>
      <div class="launch-links">
        <a href="home.html">首页 <span>3D IP</span></a>
        <a href="blog.html">技术博客 <span>Blog</span></a>
        <a href="projects.html">项目展示 <span>Projects</span></a>
        <a href="courses.html">课程售卖 <span>Courses</span></a>
        <a href="shop.html">软件商店 <span>Shop</span></a>
      </div>
    </div>
  </div>
</body>
</html>
